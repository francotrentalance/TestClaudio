[package]
name = "holdem-solver"
version = "0.1.0"
edition = "2024"
description = "GTO solver for 6-max No-Limit Hold'em: exact heads-up postflop DCFR and multiplayer preflop MCCFR"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.test]
opt-level = 3
