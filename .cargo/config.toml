# Solving is SIMD-heavy; build for the machine you run on.
# Remove this if you need a binary that runs on other CPUs.
[build]
rustflags = ["-C", "target-cpu=native"]

# When dependencies are updated, pick versions that still build with the
# Rust in Cargo.toml's rust-version (1.75, what Linux Mint's apt installs).
[resolver]
incompatible-rust-versions = "fallback"
