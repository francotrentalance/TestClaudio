[package]
name = "holdem-trainer"
version = "0.1.0"
edition = "2021"
description = "Hold'em Trainer: a GTO quiz trainer for 6-max No-Limit Hold'em"
license = "MIT"
default-run = "holdem-trainer"

# Separate from the solver crate: the app is shipped as a prebuilt .deb, so it
# can use a newer GUI stack than the solver's Rust 1.75 baseline.
[workspace]

[dependencies]
holdem-solver = { path = ".." }
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rayon = "1"
mimalloc = { version = "0.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
